name: CatCare CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Seed SQLite Database
      run: |
        python seed_data.py

    - name: Run Test Suite (Pytest)
      run: |
        pytest tests/ -v

    - name: Verify Python Code Compilation
      run: |
        python -m compileall app/ dashboard/

    - name: Smoke Test FastAPI & Streamlit
      run: |
        nohup uvicorn app.main:app --host 127.0.0.1 --port 8080 &
        sleep 3
        curl -f http://127.0.0.1:8080/docs || exit 1
        echo "FastAPI is running and healthy!"

